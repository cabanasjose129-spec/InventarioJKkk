<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Inventario de Suelas</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap');

:root{
  --rubber: #17130F;
  --panel: #241E18;
  --panel-2: #2C2419;
  --paper: #F4EEE1;
  --paper-dim: #E7DFCC;
  --ink: #1C1712;
  --ink-soft: #57503F;
  --amber: #E3A23C;
  --amber-dark: #B87E28;
  --teal: #4C8177;
  --alert: #C1443C;
  --alert-dark: #8F2F29;
  --border: #3A3025;
}

*{box-sizing:border-box; margin:0; padding:0;}

body{
  background: var(--rubber);
  background-image:
    radial-gradient(circle at 1px 1px, rgba(244,238,225,0.035) 1px, transparent 0);
  background-size: 22px 22px;
  color: var(--paper);
  font-family: 'Inter', sans-serif;
  min-height: 100vh;
  padding: 28px 20px 60px;
}

.wrap{ max-width: 980px; margin: 0 auto; }

/* ---------- HEADER : warehouse door strip ---------- */
header{
  background: linear-gradient(180deg, var(--panel-2), var(--panel));
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 22px 26px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:relative;
  overflow:hidden;
  margin-bottom: 18px;
}
header::before, header::after{
  content:"";
  position:absolute;
  top:50%; transform:translateY(-50%);
  width:12px; height:12px;
  border-radius:50%;
  background: var(--rubber);
  box-shadow: inset 0 0 0 2px var(--border);
}
header::before{ left:10px; }
header::after{ right:10px; }
.brand{ display:flex; align-items:baseline; gap:12px; }
.brand .eyebrow{
  font-family:'JetBrains Mono', monospace;
  font-size:11px;
  letter-spacing: 3px;
  color: var(--amber);
  text-transform: uppercase;
}
h1{
  font-family:'Archivo Black', sans-serif;
  font-size: 26px;
  letter-spacing: 0.5px;
  text-transform: uppercase;
}
.datebadge{
  font-family:'JetBrains Mono', monospace;
  font-size: 12px;
  color: var(--paper-dim);
  border: 1px dashed var(--border);
  padding: 6px 12px;
  border-radius: 4px;
  white-space: nowrap;
}

/* ---------- ALERT BANNER : hazard stripe ---------- */
.alert-banner{
  display:none;
  margin-bottom: 18px;
  border-radius: 6px;
  overflow: hidden;
  border: 1px solid var(--alert-dark);
}
.alert-banner.show{ display:block; }
.alert-strip{
  height: 8px;
  background: repeating-linear-gradient(45deg, var(--alert), var(--alert) 10px, #2a1210 10px, #2a1210 20px);
}
.alert-body{
  background: rgba(193,68,60,0.12);
  padding: 14px 18px;
  display:flex;
  align-items:center;
  gap: 12px;
  flex-wrap: wrap;
}
.alert-body strong{ color:#ffb3ab; font-size:14px; }
.alert-chip{
  font-family:'JetBrains Mono', monospace;
  font-size: 12px;
  background: var(--rubber);
  border: 1px solid var(--alert-dark);
  color: var(--paper);
  padding: 4px 9px;
  border-radius: 3px;
}

/* ---------- STATS: shipping labels ---------- */
.stats{
  display:grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
  margin-bottom: 22px;
}
.tag{
  background: var(--paper);
  color: var(--ink);
  border-radius: 4px;
  padding: 14px 16px 16px;
  position: relative;
  box-shadow: 0 6px 14px rgba(0,0,0,0.25);
}
.tag::before{
  content:"";
  position:absolute;
  top:10px; right:10px;
  width:8px; height:8px;
  border-radius:50%;
  background: var(--paper);
  box-shadow: inset 0 0 0 1.5px var(--ink-soft);
}
.tag .label{
  font-family:'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--ink-soft);
  display:block;
  margin-bottom: 6px;
  border-bottom: 1px dashed var(--ink-soft);
  padding-bottom: 6px;
}
.tag .value{
  font-family:'Archivo Black', sans-serif;
  font-size: 32px;
  line-height:1;
}
.tag.warn .value{ color: var(--alert-dark); }

/* ---------- TABS ---------- */
.tabs{
  display:flex;
  gap: 4px;
  margin-bottom: 14px;
  border-bottom: 1px solid var(--border);
}
.tabbtn{
  font-family:'Inter', sans-serif;
  font-weight: 700;
  font-size: 13px;
  letter-spacing: 0.3px;
  text-transform: uppercase;
  color: var(--paper-dim);
  background: none;
  border:none;
  padding: 10px 16px;
  cursor:pointer;
  border-bottom: 2px solid transparent;
  transition: color .15s ease, border-color .15s ease;
}
.tabbtn:hover{ color: var(--paper); }
.tabbtn.active{ color: var(--amber); border-color: var(--amber); }

/* ---------- TOOLBAR ---------- */
.toolbar{
  display:flex;
  gap: 10px;
  margin-bottom: 16px;
  flex-wrap: wrap;
  align-items:center;
}
input, select{
  font-family:'Inter', sans-serif;
  font-size: 13px;
  background: var(--panel);
  border: 1px solid var(--border);
  color: var(--paper);
  padding: 9px 12px;
  border-radius: 4px;
  outline: none;
}
input::placeholder{ color: #7a7060; }
input:focus, select:focus{ border-color: var(--amber); }
.search{ flex: 1; min-width: 160px; }
.btn{
  font-family:'Inter', sans-serif;
  font-weight: 700;
  font-size: 13px;
  border: none;
  border-radius: 4px;
  padding: 10px 16px;
  cursor: pointer;
  transition: transform .1s ease, filter .15s ease;
}
.btn:active{ transform: translateY(1px); }
.btn:focus-visible{ outline:2px solid var(--amber); outline-offset:2px; }
.btn-amber{ background: var(--amber); color: var(--rubber); }
.btn-amber:hover{ filter: brightness(1.08); }
.btn-teal{ background: var(--teal); color: #eafcf6; }
.btn-teal:hover{ filter: brightness(1.1); }
.btn-ghost{ background: transparent; color: var(--paper-dim); border: 1px solid var(--border); }
.btn-ghost:hover{ color: var(--paper); border-color: var(--paper-dim); }
.btn-alert{ background: var(--alert); color: #fff0ee; }
.btn-sm{ padding: 6px 10px; font-size: 12px; }

/* ---------- INVENTORY (estilos legacy, usados en otras vistas si aplica) ---------- */

.empty{
  text-align:center;
  padding: 40px 20px;
  color: var(--paper-dim);
  border: 1px dashed var(--border);
  border-radius: 6px;
  font-size: 13px;
}
.empty b{ display:block; color: var(--paper); font-size:15px; margin-bottom:6px; font-family:'Archivo Black', sans-serif; text-transform:uppercase; letter-spacing:.5px;}

/* ---------- MOVEMENTS ---------- */
.moves{ display:flex; flex-direction:column; gap:8px; }
.move-row{
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 10px 14px;
  display:flex;
  align-items:center;
  gap: 12px;
  font-size: 13px;
}
.move-tag{
  font-family:'JetBrains Mono', monospace;
  font-size: 11px;
  font-weight:700;
  padding: 3px 8px;
  border-radius: 3px;
  text-transform: uppercase;
}
.move-tag.entrada{ background: rgba(76,129,119,0.25); color: #9fd9c9; }
.move-tag.salida{ background: rgba(193,68,60,0.25); color: #f2a9a2; }
.move-desc{ flex:1; }
.move-desc b{ color: var(--paper); }
.move-date{ font-family:'JetBrains Mono', monospace; font-size:11px; color: var(--paper-dim); white-space:nowrap; }

/* ---------- MODAL ---------- */
.overlay{
  display:none;
  position: fixed; inset:0;
  background: rgba(10,8,6,0.7);
  align-items:center; justify-content:center;
  z-index: 50;
  padding: 20px;
}
.overlay.show{ display:flex; }
.modal{
  background: var(--paper);
  color: var(--ink);
  width: 100%; max-width: 420px;
  border-radius: 6px;
  padding: 24px;
  position: relative;
}
.modal::before{
  content:"";
  position:absolute; top:0; left:0; right:0; height:6px;
  background: repeating-linear-gradient(90deg, var(--amber), var(--amber) 10px, var(--ink) 10px, var(--ink) 12px);
  border-radius: 6px 6px 0 0;
}
.modal h2{
  font-family:'Archivo Black', sans-serif;
  font-size: 18px;
  text-transform: uppercase;
  margin-bottom: 16px;
  padding-top: 6px;
}
.field{ margin-bottom: 12px; }
.field label{
  display:block;
  font-family:'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--ink-soft);
  margin-bottom: 5px;
}
.field input, .field select{
  width: 100%;
  background: #fff;
  border: 1px solid #cabf9f;
  color: var(--ink);
}
.field input:focus, .field select:focus{ border-color: var(--amber-dark); }
.row2{ display:grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.modal-actions{ display:flex; justify-content:flex-end; gap:8px; margin-top: 18px; }
.err{ color: var(--alert-dark); font-size:12px; margin-top:8px; display:none; font-weight:600; }
.err.show{ display:block; }

.scan-modal{ max-width: 380px; }
.scan-frame{
  position: relative;
  border-radius: 6px;
  overflow: hidden;
  background: #000;
  aspect-ratio: 4 / 3;
}
.scan-frame video{ width:100%; height:100%; object-fit: cover; display:block; }
.scan-guide{
  position: absolute;
  inset: 18% 10%;
  border: 2px dashed var(--amber);
  border-radius: 6px;
  pointer-events: none;
}
.scan-status{
  font-family:'JetBrains Mono', monospace;
  font-size: 12px;
  color: var(--ink-soft);
  text-align: center;
  margin-top: 10px;
}
.scan-feedback{
  font-family:'JetBrains Mono', monospace;
  font-size: 11px;
  padding: 8px 10px;
  border-radius: 4px;
  margin-top: -4px;
  margin-bottom: 12px;
  display: none;
}
.scan-feedback.show{ display:block; }
.scan-feedback.ok{ background: rgba(76,129,119,0.15); color: #2f5b53; border:1px solid #4c8177; }
.scan-feedback.bad{ background: rgba(193,68,60,0.12); color: var(--alert-dark); border:1px solid var(--alert); }

.helper{ font-size:11px; color:var(--paper-dim); margin: -8px 0 16px; font-family:'JetBrains Mono', monospace;}
.scan-hint{
  font-family:'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--ink-soft);
  text-align: center;
  margin-bottom: 10px;
  position: relative;
}

@media (max-width: 640px){
  .stats{ grid-template-columns: 1fr; }
  h1{ font-size: 20px; }
}

/* ---------- INVENTARIO: rediseño minimalista ---------- */
#tab-inv .inv-toolbar{
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: 18px;
}
#tab-inv .inv-search{ position: relative; }
#tab-inv .inv-search input{
  width: 100%;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 11px 42px 11px 14px;
  font-family: 'Inter', sans-serif;
  font-size: 14px;
  color: var(--paper);
}
#tab-inv .inv-search input::placeholder{ color: #7a7060; }
#tab-inv .inv-search input:focus{ outline: none; border-color: var(--amber); }
#tab-inv .inv-search button{
  position: absolute;
  right: 4px; top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  cursor: pointer;
  font-size: 15px;
  padding: 8px;
  color: var(--paper-dim);
  border-radius: 6px;
}
#tab-inv .inv-search button:hover{ background: var(--panel-2); }

#tab-inv .inv-filters{
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
#tab-inv .inv-filters select{
  flex: 1;
  min-width: 110px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 9px 10px;
  font-family: 'Inter', sans-serif;
  font-size: 13px;
  color: var(--paper-dim);
}
#tab-inv .inv-filters select:focus{ outline: none; border-color: var(--amber); color: var(--paper); }

#tab-inv .inv-actions{
  display: flex;
  gap: 8px;
  justify-content: flex-end;
}
#tab-inv .inv-btn{
  font-family: 'Inter', sans-serif;
  font-size: 13px;
  font-weight: 600;
  border-radius: 8px;
  padding: 10px 16px;
  cursor: pointer;
  border: 1px solid transparent;
  transition: filter .15s ease, border-color .15s ease, color .15s ease;
}
#tab-inv .inv-btn-ghost{ background: transparent; border-color: var(--border); color: var(--paper-dim); }
#tab-inv .inv-btn-ghost:hover{ color: var(--paper); border-color: var(--paper-dim); }
#tab-inv .inv-btn-primary{ background: var(--amber); color: var(--rubber); }
#tab-inv .inv-btn-primary:hover{ filter: brightness(1.08); }

#tab-inv .inv-list{
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
}
#tab-inv .inv-row{
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 13px 16px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  transition: background .12s ease;
}
#tab-inv .inv-row:last-child{ border-bottom: none; }
#tab-inv .inv-row:hover{ background: var(--panel-2); }
#tab-inv .inv-dot{
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--teal);
  flex-shrink: 0;
}
#tab-inv .inv-row.low .inv-dot{ background: var(--alert); }
#tab-inv .inv-main{ flex: 1; min-width: 0; }
#tab-inv .inv-modelo{
  font-size: 14px;
  font-weight: 600;
  color: var(--paper);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
#tab-inv .inv-meta{
  font-size: 12px;
  color: var(--paper-dim);
  margin-top: 2px;
}
#tab-inv .inv-qty{
  font-family: 'JetBrains Mono', monospace;
  font-size: 15px;
  font-weight: 600;
  color: var(--paper);
  min-width: 40px;
  text-align: right;
}
#tab-inv .inv-row.low .inv-qty{ color: var(--alert); }
#tab-inv .inv-row-actions{ display: flex; gap: 2px; }
#tab-inv .inv-icon{
  width: 28px; height: 28px;
  border-radius: 6px;
  border: none;
  background: transparent;
  color: var(--paper-dim);
  cursor: pointer;
  font-size: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
}
#tab-inv .inv-icon:hover{ background: var(--border); color: var(--paper); }
#tab-inv .inv-empty{
  text-align: center;
  padding: 40px 20px;
  color: var(--paper-dim);
  font-size: 13px;
  border: 1px dashed var(--border);
  border-radius: 10px;
}

@media (max-width: 640px){
  #tab-inv .inv-actions{ flex-direction: column; }
  #tab-inv .inv-actions .inv-btn{ width: 100%; }
}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <div>
        <span class="eyebrow">Dep&oacute;sito · Control de stock</span>
        <h1>Inventario de Suelas</h1>
      </div>
    </div>
    <div class="datebadge" id="todayBadge">--/--/----</div>
  </header>

  <div class="alert-banner" id="alertBanner">
    <div class="alert-strip"></div>
    <div class="alert-body">
      <strong>⚠ Stock bajo m&iacute;nimo:</strong>
      <div id="alertChips" style="display:flex; gap:6px; flex-wrap:wrap;"></div>
    </div>
  </div>

  <div class="stats">
    <div class="tag"><span class="label">Modelos distintos</span><span class="value" id="statSkus">0</span></div>
    <div class="tag"><span class="label">Unidades totales</span><span class="value" id="statUnits">0</span></div>
    <div class="tag warn"><span class="label">Debajo del m&iacute;nimo</span><span class="value" id="statLow">0</span></div>
  </div>

  <div class="tabs">
    <button class="tabbtn active" data-tab="inv">Inventario</button>
    <button class="tabbtn" data-tab="mov">Movimientos</button>
  </div>

  <!-- INVENTARIO -->
  <div id="tab-inv">
    <div class="inv-toolbar">
      <div class="inv-search">
        <input id="searchInput" placeholder="Buscar suela...">
        <button id="scanSearchBtn" title="Escanear código de barras">📷</button>
      </div>
      <div class="inv-filters">
        <select id="filterModelo"><option value="">Modelo</option></select>
        <select id="filterColor"><option value="">Color</option></select>
        <select id="filterTalle"><option value="">Talle</option></select>
      </div>
      <div class="inv-actions">
        <button class="inv-btn inv-btn-ghost" id="importExcelBtn" title="Cargar un Excel con Modelo, Color, Talle y Cantidad">📤 Importar Excel</button>
        <input type="file" id="importExcelFile" accept=".xlsx,.xls" style="display:none;">
        <button class="inv-btn inv-btn-ghost" id="backupData" title="Descarga un archivo con todo tu inventario y movimientos">💾 Backup</button>
        <button class="inv-btn inv-btn-ghost" id="restoreData" title="Carga un backup descargado desde otro dispositivo">📥 Restaurar</button>
        <input type="file" id="restoreFile" accept="application/json" style="display:none;">
        <button class="inv-btn inv-btn-ghost" id="exportExcel">Exportar Excel</button>
        <button class="inv-btn inv-btn-primary" id="openAddItem">+ Nueva suela</button>
      </div>
    </div>
    <div class="inv-list" id="itemsList"></div>
  </div>

  <!-- MOVIMIENTOS -->
  <div id="tab-mov" style="display:none;">
    <div class="toolbar">
      <button class="btn btn-teal" id="openMove">Registrar movimiento</button>
    </div>
    <div class="moves" id="movesList"></div>
  </div>

</div>

<!-- MODAL: agregar / editar item -->
<div class="overlay" id="itemOverlay">
  <div class="modal">
    <h2 id="itemModalTitle">Nueva suela</h2>
    <div class="row2">
      <div class="field">
        <label>Modelo</label>
        <input id="fModelo" placeholder="Ej: Trekking Pro">
      </div>
      <div class="field">
        <label>Color</label>
        <input id="fColor" placeholder="Ej: Negro">
      </div>
    </div>
    <div class="row2">
      <div class="field">
        <label>Talle</label>
        <input id="fTalle" placeholder="Ej: 40">
      </div>
      <div class="field">
        <label>C&oacute;digo de barras</label>
        <div style="display:flex; gap:6px;">
          <input id="fCodigo" placeholder="Opcional" style="flex:1;">
          <button type="button" class="btn btn-ghost btn-sm" id="scanCodigoBtn" title="Escanear con cámara">📷</button>
        </div>
      </div>
    </div>
    <div class="row2">
      <div class="field">
        <label>Cantidad inicial</label>
        <input id="fCantidad" type="number" min="0" value="0">
      </div>
      <div class="field">
        <label>Stock m&iacute;nimo</label>
        <input id="fMinimo" type="number" min="0" value="5">
      </div>
    </div>
    <div class="err" id="itemErr"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="cancelItem">Cancelar</button>
      <button class="btn btn-amber" id="saveItem">Guardar</button>
    </div>
  </div>
</div>

<!-- MODAL: movimiento -->
<div class="overlay" id="moveOverlay">
  <div class="modal">
    <h2>Registrar movimiento</h2>
    <div class="row2">
      <div class="field">
        <label>Tipo</label>
        <select id="mTipo">
          <option value="entrada">Entrada</option>
          <option value="salida">Salida</option>
        </select>
      </div>
      <div class="field">
        <label>Cantidad</label>
        <input id="mCantidad" type="number" min="1" value="1">
      </div>
    </div>
    <button type="button" class="btn btn-amber" id="openMoveScan" style="width:100%; margin-bottom:16px;">📷 Escanear y aplicar</button>
    <div class="scan-hint">o eleg&iacute; la suela manualmente:</div>
    <div class="field">
      <label>Suela</label>
      <select id="mItem"></select>
    </div>
    <div class="field">
      <label>Nota (opcional)</label>
      <input id="mNota" placeholder="Ej: pedido #123">
    </div>
    <div class="err" id="moveErr"></div>
    <div class="scan-feedback" id="scanFeedback"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="cancelMove">Cancelar</button>
      <button class="btn btn-teal" id="saveMove">Confirmar</button>
    </div>
  </div>
</div>

<!-- MODAL: escanear código de barras -->
<div class="overlay" id="scanOverlay">
  <div class="modal scan-modal">
    <h2>Escanear c&oacute;digo</h2>
    <div class="scan-frame">
      <video id="scanVideo" autoplay playsinline muted></video>
      <div class="scan-guide"></div>
    </div>
    <p class="scan-status" id="scanStatus">Apunt&aacute; la c&aacute;mara al c&oacute;digo de barras...</p>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="cancelScan">Cancelar</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
/* Datos importados desde STOCK_1_1.xlsx: 600 combinaciones modelo/color/talle, 1257 unidades.

<script>
/* Guardado local: usa localStorage del navegador para que los datos persistan
   al abrir este archivo directamente (doble clic) sin depender de Claude. */
const storage = {
  get: (key) => {
    const v = localStorage.getItem('inv_suelas__' + key);
    return v !== null ? { key, value: v } : null;
  },
  set: (key, value) => {
    localStorage.setItem('inv_suelas__' + key, value);
    return { key, value };
  }
};

let items = [];
let moves = [];
let editingId = null;

const $ = (id) => document.getElementById(id);

function todayStr(){
  const d = new Date();
  return d.toLocaleDateString('es-AR', { day:'2-digit', month:'2-digit', year:'numeric' });
}
$('todayBadge').textContent = todayStr();

function tryGetRaw(key){
  try{
    const r = storage.get(key);
    return r ? r.value : null;
  }catch(e){
    return null;
  }
}

async function loadData(){
  const itemsRaw = await tryGetRaw('items');
  if(itemsRaw){
    try{ items = JSON.parse(itemsRaw); }catch(e){ items = []; }
  }
  if(!itemsRaw || !Array.isArray(items) || items.length === 0){
    items = SEED_ITEMS.map(i => Object.assign({}, i));
    await saveItems();
  }

  const movesRaw = await tryGetRaw('movimientos');
  moves = movesRaw ? JSON.parse(movesRaw) : [];
  render();
}

async function saveItems(){
  try{ storage.set('items', JSON.stringify(items)); }
  catch(e){ console.error('Error guardando items', e); }
}
async function saveMoves(){
  try{ storage.set('movimientos', JSON.stringify(moves)); }
  catch(e){ console.error('Error guardando movimientos', e); }
}

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function render(){
  renderFilterOptions();
  renderItems();
  renderStats();
  renderAlert();
  renderMoves();
  renderMoveItemSelect();
}

function renderFilterOptions(){
  const buildOptions = (selId, placeholder, values) => {
    const sel = $(selId);
    const current = sel.value;
    sel.innerHTML = `<option value="">${placeholder}</option>` + values.map(v => `<option value="${v}">${v}</option>`).join('');
    sel.value = values.includes(current) ? current : '';
  };
  buildOptions('filterModelo', 'Modelo', [...new Set(items.map(i => i.modelo))].sort());
  buildOptions('filterColor', 'Color', [...new Set(items.map(i => i.color))].sort());
  buildOptions('filterTalle', 'Talle', [...new Set(items.map(i => i.talle))].sort());
}

function filteredItems(){
  const q = $('searchInput').value.trim().toLowerCase();
  const modeloFilter = $('filterModelo').value;
  const colorFilter = $('filterColor').value;
  const talleFilter = $('filterTalle').value;
  return items.filter(i => {
    const matchesQ = !q || `${i.modelo} ${i.color} ${i.talle} ${i.codigoBarras || ''}`.toLowerCase().includes(q);
    const matchesModelo = !modeloFilter || i.modelo === modeloFilter;
    const matchesColor = !colorFilter || i.color === colorFilter;
    const matchesTalle = !talleFilter || i.talle === talleFilter;
    return matchesQ && matchesModelo && matchesColor && matchesTalle;
  });
}

function renderItems(){
  const list = $('itemsList');
  const data = filteredItems();
  if(data.length === 0){
    list.innerHTML = `<div class="inv-empty">Sin resultados. Agregá una suela nueva o ajustá los filtros.</div>`;
    return;
  }
  list.innerHTML = data.map(i => {
    const low = i.cantidad <= i.minimo;
    return `
    <div class="inv-row ${low ? 'low' : ''}">
      <div class="inv-dot"></div>
      <div class="inv-main">
        <div class="inv-modelo">${i.modelo}</div>
        <div class="inv-meta">${i.color} · Talle ${i.talle}${i.codigoBarras ? ' · ' + i.codigoBarras : ''}</div>
      </div>
      <div class="inv-qty">${i.cantidad}</div>
      <div class="inv-row-actions">
        <button class="inv-icon" title="Editar" onclick="openEditItem('${i.id}')">✎</button>
        <button class="inv-icon" title="Eliminar" onclick="deleteItem('${i.id}')">✕</button>
      </div>
    </div>`;
  }).join('');
}

function renderStats(){
  $('statSkus').textContent = items.length;
  $('statUnits').textContent = items.reduce((a,i) => a + i.cantidad, 0);
  $('statLow').textContent = items.filter(i => i.cantidad <= i.minimo).length;
}

function renderAlert(){
  const low = items.filter(i => i.cantidad <= i.minimo);
  const banner = $('alertBanner');
  if(low.length === 0){ banner.classList.remove('show'); return; }
  banner.classList.add('show');
  $('alertChips').innerHTML = low.map(i => `<span class="alert-chip">${i.modelo} ${i.color} T${i.talle}: ${i.cantidad}</span>`).join('');
}

function renderMoves(){
  const list = $('movesList');
  if(moves.length === 0){
    list.innerHTML = `<div class="empty"><b>Todav&iacute;a no hay movimientos</b>Registr&aacute; entradas y salidas de stock desde ac&aacute;.</div>`;
    return;
  }
  const sorted = [...moves].sort((a,b) => b.ts - a.ts);
  list.innerHTML = sorted.map(m => {
    const item = items.find(i => i.id === m.itemId);
    const desc = item ? `${item.modelo} ${item.color} T${item.talle}` : '(eliminado)';
    return `
    <div class="move-row">
      <span class="move-tag ${m.tipo}">${m.tipo === 'entrada' ? '↑ Entrada' : '↓ Salida'}</span>
      <span class="move-desc"><b>${m.cantidad}</b> — ${desc}${m.nota ? ' · ' + m.nota : ''}</span>
      <span class="move-date">${m.fecha}</span>
    </div>`;
  }).join('');
}

function renderMoveItemSelect(){
  const sel = $('mItem');
  sel.innerHTML = items.map(i => `<option value="${i.id}">${i.modelo} — ${i.color} — Talle ${i.talle} (stock: ${i.cantidad})</option>`).join('');
}

/* ---------- SEARCH / FILTER ---------- */
$('searchInput').addEventListener('input', renderItems);
$('filterModelo').addEventListener('change', renderItems);
$('filterColor').addEventListener('change', renderItems);

/* ---------- ITEM MODAL ---------- */
function openAddItemModal(){
  editingId = null;
  $('itemModalTitle').textContent = 'Nueva suela';
  $('fModelo').value = '';
  $('fColor').value = '';
  $('fTalle').value = '';
  $('fCodigo').value = '';
  $('fCantidad').value = 0;
  $('fMinimo').value = 5;
  $('itemErr').classList.remove('show');
  $('itemOverlay').classList.add('show');
}
window.openEditItem = function(id){
  const item = items.find(i => i.id === id);
  if(!item) return;
  editingId = id;
  $('itemModalTitle').textContent = 'Editar suela';
  $('fModelo').value = item.modelo;
  $('fColor').value = item.color;
  $('fTalle').value = item.talle;
  $('fCodigo').value = item.codigoBarras || '';
  $('fCantidad').value = item.cantidad;
  $('fMinimo').value = item.minimo;
  $('itemErr').classList.remove('show');
  $('itemOverlay').classList.add('show');
};
window.deleteItem = function(id){
  if(!confirm('¿Eliminar esta suela del inventario?')) return;
  items = items.filter(i => i.id !== id);
  saveItems();
  render();
};
$('openAddItem').addEventListener('click', openAddItemModal);
$('cancelItem').addEventListener('click', () => $('itemOverlay').classList.remove('show'));

$('saveItem').addEventListener('click', async () => {
  const modelo = $('fModelo').value.trim();
  const color = $('fColor').value.trim();
  const talle = $('fTalle').value.trim();
  const codigoBarras = $('fCodigo').value.trim();
  const cantidad = parseInt($('fCantidad').value, 10);
  const minimo = parseInt($('fMinimo').value, 10);

  if(!modelo || !color || !talle || isNaN(cantidad) || isNaN(minimo) || cantidad < 0 || minimo < 0){
    $('itemErr').textContent = 'Completá modelo, color, talle, cantidad y mínimo con valores válidos.';
    $('itemErr').classList.add('show');
    return;
  }

  if(editingId){
    const item = items.find(i => i.id === editingId);
    Object.assign(item, { modelo, color, talle, codigoBarras, cantidad, minimo });
  } else {
    items.push({ id: uid(), modelo, color, talle, codigoBarras, cantidad, minimo });
  }
  await saveItems();
  $('itemOverlay').classList.remove('show');
  render();
});

/* ---------- MOVE MODAL ---------- */
$('openMove').addEventListener('click', () => {
  if(items.length === 0){
    alert('Primero agregá al menos una suela al inventario.');
    return;
  }
  $('mTipo').value = 'entrada';
  $('mCantidad').value = 1;
  $('mNota').value = '';
  $('moveErr').classList.remove('show');
  renderMoveItemSelect();
  $('moveOverlay').classList.add('show');
});
$('cancelMove').addEventListener('click', () => { closeScanner(); $('moveOverlay').classList.remove('show'); });

$('saveMove').addEventListener('click', async () => {
  const itemId = $('mItem').value;
  const tipo = $('mTipo').value;
  const cantidad = parseInt($('mCantidad').value, 10);
  const nota = $('mNota').value.trim();
  const item = items.find(i => i.id === itemId);

  if(!item || isNaN(cantidad) || cantidad <= 0){
    $('moveErr').textContent = 'Elegí una suela y una cantidad válida.';
    $('moveErr').classList.add('show');
    return;
  }
  if(tipo === 'salida' && cantidad > item.cantidad){
    $('moveErr').textContent = `No hay stock suficiente (disponible: ${item.cantidad}).`;
    $('moveErr').classList.add('show');
    return;
  }

  item.cantidad += tipo === 'entrada' ? cantidad : -cantidad;
  moves.push({ id: uid(), itemId, tipo, cantidad, nota, fecha: todayStr(), ts: Date.now() });

  await saveItems();
  await saveMoves();
  $('moveOverlay').classList.remove('show');
  render();
});

/* ---------- ESCÁNER DE CÓDIGO DE BARRAS ---------- */
let scanStream = null;
let scanTarget = null;
let scanRAF = null;
let scanPaused = false;
let scanFlashTimeout = null;

async function openScanner(target){
  scanTarget = target;
  scanPaused = false;
  $('scanStatus').textContent = target === 'movimiento'
    ? 'Escaneá cada suela: se suma o resta sola del inventario.'
    : 'Apuntá la cámara al código de barras...';
  $('scanFeedback').classList.remove('show', 'ok', 'bad');
  $('scanOverlay').classList.add('show');

  if(!('BarcodeDetector' in window)){
    $('scanStatus').textContent = 'Tu navegador no soporta el lector con cámara. Escribí el código a mano.';
    return;
  }
  try{
    scanStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    const video = $('scanVideo');
    video.srcObject = scanStream;
    await video.play();
    const detector = new BarcodeDetector({ formats: ['ean_13','ean_8','upc_a','upc_e','code_128','code_39','itf','codabar'] });
    const tick = async () => {
      if(!scanStream) return;
      if(!scanPaused){
        try{
          const codes = await detector.detect(video);
          if(codes.length > 0){ handleScanResult(codes[0].rawValue); }
        }catch(e){ /* frame sin datos válidos, seguir intentando */ }
      }
      scanRAF = requestAnimationFrame(tick);
    };
    scanRAF = requestAnimationFrame(tick);
  }catch(e){
    $('scanStatus').textContent = 'No se pudo acceder a la cámara. Revisá los permisos del navegador.';
  }
}

function handleScanResult(code){
  if(scanTarget === 'movimiento'){
    applyMovementScan(code);
    return; // la cámara sigue activa para encadenar más escaneos
  }
  closeScanner();
  if(scanTarget === 'search'){
    $('searchInput').value = code;
    renderItems();
  } else if(scanTarget === 'fCodigo'){
    $('fCodigo').value = code;
  }
}

async function applyMovementScan(code){
  scanPaused = true; // evita leer el mismo código varias veces seguidas

  const item = items.find(i => i.codigoBarras && i.codigoBarras === code);
  const tipo = $('mTipo').value;
  const cantidad = parseInt($('mCantidad').value, 10) || 1;

  if(!item){
    scanFeedback(`✕ Código sin coincidencia en el inventario: ${code}`, false);
  } else if(tipo === 'salida' && cantidad > item.cantidad){
    scanFeedback(`✕ Stock insuficiente de ${item.modelo} ${item.color} T${item.talle} (disponible: ${item.cantidad})`, false);
  } else {
    item.cantidad += tipo === 'entrada' ? cantidad : -cantidad;
    moves.push({ id: uid(), itemId: item.id, tipo, cantidad, nota: '', fecha: todayStr(), ts: Date.now() });
    await saveItems();
    await saveMoves();
    render();
    $('mItem').value = item.id;
    scanFeedback(`✓ ${tipo === 'entrada' ? 'Entrada' : 'Salida'} aplicada: ${item.modelo} ${item.color} T${item.talle} (${tipo === 'entrada' ? '+' : '-'}${cantidad})`, true);
  }

  setTimeout(() => { scanPaused = false; }, 1400);
}

function scanFeedback(msg, ok){
  const el = $('scanFeedback');
  el.textContent = msg;
  el.className = 'scan-feedback show ' + (ok ? 'ok' : 'bad');
  clearTimeout(scanFlashTimeout);
  scanFlashTimeout = setTimeout(() => { el.classList.remove('show'); }, 2200);
}

function closeScanner(){
  if(scanRAF) cancelAnimationFrame(scanRAF);
  scanRAF = null;
  scanPaused = false;
  if(scanStream){
    scanStream.getTracks().forEach(t => t.stop());
    scanStream = null;
  }
  $('scanOverlay').classList.remove('show');
}

$('scanSearchBtn').addEventListener('click', () => openScanner('search'));
$('scanCodigoBtn').addEventListener('click', () => openScanner('fCodigo'));
$('openMoveScan').addEventListener('click', () => {
  if(items.length === 0){
    alert('Primero agregá al menos una suela al inventario.');
    return;
  }
  openScanner('movimiento');
});
$('cancelScan').addEventListener('click', closeScanner);
$('scanOverlay').addEventListener('click', (e) => { if(e.target === $('scanOverlay')) closeScanner(); });


/* ---------- IMPORTAR EXCEL ---------- */
function normalizarEncabezado(s){
  return s.toString().trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
}
const ALIAS_COLUMNAS = {
  modelo: ['modelo', 'articulo', 'articulos'],
  color: ['color'],
  talle: ['talle', 'talla', 'numero', 'nº', 'n'],
  cantidad: ['cantidad', 'cant', 'stock'],
  minimo: ['stock minimo', 'minimo', 'stock min'],
  codigo: ['codigo de barras', 'codigo', 'barcode', 'ean']
};
function buscarColumna(headerKeys, tipo){
  for(const k of headerKeys){
    if(ALIAS_COLUMNAS[tipo].includes(normalizarEncabezado(k))) return k;
  }
  return null;
}

$('importExcelBtn').addEventListener('click', () => $('importExcelFile').click());

$('importExcelFile').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async (ev) => {
    try{
      const wb = XLSX.read(ev.target.result, { type: 'array' });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, { defval: '' });

      if(rows.length === 0){
        alert('El Excel no tiene filas de datos.');
        return;
      }

      const headerKeys = Object.keys(rows[0]);
      const kModelo = buscarColumna(headerKeys, 'modelo');
      const kColor = buscarColumna(headerKeys, 'color');
      const kTalle = buscarColumna(headerKeys, 'talle');
      const kCantidad = buscarColumna(headerKeys, 'cantidad');
      const kMinimo = buscarColumna(headerKeys, 'minimo');
      const kCodigo = buscarColumna(headerKeys, 'codigo');

      if(!kModelo || !kColor || !kTalle || !kCantidad){
        alert('Faltan columnas obligatorias. El Excel necesita al menos: Modelo, Color, Talle y Cantidad. Revisá los nombres de los encabezados en la primera fila.');
        return;
      }

      const parsed = [];
      for(const row of rows){
        const modelo = (row[kModelo] ?? '').toString().trim();
        const color = (row[kColor] ?? '').toString().trim();
        const talle = (row[kTalle] ?? '').toString().trim();
        const cantidad = parseInt(row[kCantidad], 10);
        if(!modelo || !color || !talle || isNaN(cantidad)) continue;
        const minimo = kMinimo ? (parseInt(row[kMinimo], 10) || 0) : 0;
        const codigoBarras = kCodigo ? (row[kCodigo] ?? '').toString().trim() : '';
        parsed.push({ modelo, color, talle, cantidad, minimo, codigoBarras });
      }

      if(parsed.length === 0){
        alert('No se pudo leer ninguna fila válida. Revisá que Modelo, Color, Talle y Cantidad estén completos.');
        return;
      }

      const reemplazar = confirm(`Se encontraron ${parsed.length} filas válidas.\n\nAceptar = REEMPLAZAR todo el inventario actual por estos datos.\nCancelar = elegir sumarlos al inventario existente en el siguiente paso.`);

      if(reemplazar){
        items = parsed.map(p => ({ id: uid(), ...p }));
      } else {
        const sumar = confirm('¿Sumar estas filas al inventario existente?\n\nSi una suela con el mismo modelo, color y talle ya existe, se suma la cantidad. Si no existe, se agrega nueva.\n\nCancelar aborta la importación sin cambiar nada.');
        if(!sumar) return;
        parsed.forEach(p => {
          const existente = items.find(i =>
            i.modelo.toLowerCase() === p.modelo.toLowerCase() &&
            i.color.toLowerCase() === p.color.toLowerCase() &&
            i.talle.toLowerCase() === p.talle.toLowerCase()
          );
          if(existente){
            existente.cantidad += p.cantidad;
            if(!existente.codigoBarras && p.codigoBarras) existente.codigoBarras = p.codigoBarras;
          } else {
            items.push({ id: uid(), ...p });
          }
        });
      }

      await saveItems();
      render();
      alert(`Importación completa: ${parsed.length} filas procesadas.`);
    }catch(err){
      alert('No se pudo leer el archivo. Verificá que sea un .xlsx válido con el formato indicado.');
    }
    $('importExcelFile').value = '';
  };
  reader.readAsArrayBuffer(file);
});

/* ---------- BACKUP / RESTAURAR (para mover datos entre celular y PC) ---------- */
$('backupData').addEventListener('click', () => {
  const backup = {
    exportado: new Date().toISOString(),
    items,
    moves
  };
  const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `inventario-suelas-backup-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
});

$('restoreData').addEventListener('click', () => $('restoreFile').click());

$('restoreFile').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async (ev) => {
    try{
      const data = JSON.parse(ev.target.result);
      if(!Array.isArray(data.items)){
        alert('Este archivo no parece un backup válido del inventario.');
        return;
      }
      const cantidadItems = data.items.length;
      const cantidadMovs = Array.isArray(data.moves) ? data.moves.length : 0;
      const ok = confirm(`Este backup tiene ${cantidadItems} suelas y ${cantidadMovs} movimientos.\n\nEsto va a REEMPLAZAR todo lo que tenés cargado en este dispositivo ahora mismo. ¿Continuar?`);
      if(!ok) return;
      items = data.items;
      moves = Array.isArray(data.moves) ? data.moves : [];
      await saveItems();
      await saveMoves();
      render();
      alert('Backup restaurado correctamente.');
    }catch(err){
      alert('No se pudo leer el archivo. Verificá que sea un backup exportado desde esta misma app.');
    }
    $('restoreFile').value = '';
  };
  reader.readAsText(file);
});

/* ---------- EXPORT EXCEL ---------- */
$('exportExcel').addEventListener('click', () => {
  if(items.length === 0){
    alert('No hay suelas cargadas todavía.');
    return;
  }
  const rows = items.map(i => ({
    'Modelo': i.modelo,
    'Color': i.color,
    'Talle': i.talle,
    'Código de barras': i.codigoBarras || '',
    'Cantidad': i.cantidad,
    'Stock mínimo': i.minimo,
    'Estado': i.cantidad <= i.minimo ? 'BAJO MÍNIMO' : 'OK'
  }));
  const ws = XLSX.utils.json_to_sheet(rows);
  ws['!cols'] = [{wch:18},{wch:14},{wch:8},{wch:18},{wch:10},{wch:12},{wch:14}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Inventario');
  const fecha = new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb, `inventario-suelas-${fecha}.xlsx`);
});

[$('itemOverlay'), $('moveOverlay')].forEach(ov => {
  ov.addEventListener('click', (e) => { if(e.target === ov) ov.classList.remove('show'); });
});

loadData();
