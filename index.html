<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Inventario de Suelas</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap');

:root{
  --rubber: #17130F;
  --panel: #241E18;
  --panel-2: #2C2419;
  --paper: #F4EEE1;
  --paper-dim: #E7DFCC;
  --ink: #1C1712;
  --ink-soft: #57503F;
  --amber: #E3A23C;
  --amber-dark: #B87E28;
  --teal: #4C8177;
  --alert: #C1443C;
  --alert-dark: #8F2F29;
  --border: #3A3025;
}

*{box-sizing:border-box; margin:0; padding:0;}

body{
  background: var(--rubber);
  background-image:
    radial-gradient(circle at 1px 1px, rgba(244,238,225,0.035) 1px, transparent 0);
  background-size: 22px 22px;
  color: var(--paper);
  font-family: 'Inter', sans-serif;
  min-height: 100vh;
  padding: 28px 20px 60px;
}

.wrap{ max-width: 980px; margin: 0 auto; }

/* ---------- LOGIN ---------- */
.login-screen{
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.login-card{
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 32px 28px;
  width: 100%;
  max-width: 380px;
  text-align: center;
}
.login-card .eyebrow{
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  letter-spacing: 3px;
  color: var(--amber);
  text-transform: uppercase;
}
.login-title{
  font-family: 'Archivo Black', sans-serif;
  font-size: 22px;
  text-transform: uppercase;
  margin: 6px 0 24px;
}
.login-card .field{ text-align: left; margin-bottom: 14px; }
.login-card .field label{
  display: block;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--paper-dim);
  margin-bottom: 5px;
}
.login-card .field input{
  width: 100%;
  background: var(--rubber);
  border: 1px solid var(--border);
  color: var(--paper);
  border-radius: 6px;
  padding: 10px 12px;
  font-family: 'Inter', sans-serif;
  font-size: 14px;
}
.login-card .field input:focus{ outline: none; border-color: var(--amber); }
.login-card .err{ text-align: left; color: var(--alert); font-size: 12px; margin-bottom: 6px; }
.login-status{
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--paper-dim);
  margin-top: 12px;
}

/* ---------- HEADER : warehouse door strip ---------- */
header{
  background: linear-gradient(180deg, var(--panel-2), var(--panel));
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 22px 26px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:relative;
  margin-bottom: 18px;
}
header::before, header::after{
  content:"";
  position:absolute;
  top:50%; transform:translateY(-50%);
  width:12px; height:12px;
  border-radius:50%;
  background: var(--rubber);
  box-shadow: inset 0 0 0 2px var(--border);
}
header::before{ left:10px; }
header::after{ right:10px; }
.brand{ display:flex; align-items:baseline; gap:12px; }
.brand .eyebrow{
  font-family:'JetBrains Mono', monospace;
  font-size:11px;
  letter-spacing: 3px;
  color: var(--amber);
  text-transform: uppercase;
}
h1{
  font-family:'Archivo Black', sans-serif;
  font-size: 26px;
  letter-spacing: 0.5px;
  text-transform: uppercase;
}
.datebadge{
  font-family:'JetBrains Mono', monospace;
  font-size: 12px;
  color: var(--paper-dim);
  border: 1px dashed var(--border);
  padding: 6px 12px;
  border-radius: 4px;
  white-space: nowrap;
}

.menu-wrap{ position: relative; }
.menu-btn{
  width: 34px; height: 34px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--panel-2);
  color: var(--paper);
  font-size: 18px;
  line-height: 1;
  cursor: pointer;
}
.menu-btn:hover{ border-color: var(--paper-dim); }
.menu-dropdown{
  display: none;
  position: absolute;
  right: 0; top: calc(100% + 6px);
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  min-width: 190px;
  padding: 6px;
  z-index: 40;
  box-shadow: 0 10px 24px rgba(0,0,0,0.35);
}
.menu-dropdown.show{ display: flex; flex-direction: column; gap: 2px; }
.menu-item{
  text-align: left;
  background: none;
  border: none;
  color: var(--paper);
  font-family: 'Inter', sans-serif;
  font-size: 13px;
  padding: 9px 10px;
  border-radius: 6px;
  cursor: pointer;
}
.menu-item:hover{ background: var(--panel-2); }



/* ---------- STATS: shipping labels ---------- */
.stats{
  display:grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
  margin-bottom: 22px;
}
.tag{
  background: var(--paper);
  color: var(--ink);
  border-radius: 4px;
  padding: 14px 16px 16px;
  position: relative;
  box-shadow: 0 6px 14px rgba(0,0,0,0.25);
}
.tag::before{
  content:"";
  position:absolute;
  top:10px; right:10px;
  width:8px; height:8px;
  border-radius:50%;
  background: var(--paper);
  box-shadow: inset 0 0 0 1.5px var(--ink-soft);
}
.tag .label{
  font-family:'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--ink-soft);
  display:block;
  margin-bottom: 6px;
  border-bottom: 1px dashed var(--ink-soft);
  padding-bottom: 6px;
}
.tag .value{
  font-family:'Archivo Black', sans-serif;
  font-size: 32px;
  line-height:1;
}
.tag.warn .value{ color: var(--alert-dark); }
.tag-clickable{ cursor: pointer; transition: transform .1s ease, box-shadow .15s ease; }
.tag-clickable:hover{ box-shadow: 0 6px 16px rgba(0,0,0,0.32); transform: translateY(-1px); }

/* ---------- TABS ---------- */
.tabs{
  display:flex;
  gap: 4px;
  margin-bottom: 14px;
  border-bottom: 1px solid var(--border);
}
.tabbtn{
  font-family:'Inter', sans-serif;
  font-weight: 700;
  font-size: 13px;
  letter-spacing: 0.3px;
  text-transform: uppercase;
  color: var(--paper-dim);
  background: none;
  border:none;
  padding: 10px 16px;
  cursor:pointer;
  border-bottom: 2px solid transparent;
  transition: color .15s ease, border-color .15s ease;
}
.tabbtn:hover{ color: var(--paper); }
.tabbtn.active{ color: var(--amber); border-color: var(--amber); }

/* ---------- TOOLBAR ---------- */
.toolbar{
  display:flex;
  gap: 10px;
  margin-bottom: 16px;
  flex-wrap: wrap;
  align-items:center;
}
input, select{
  font-family:'Inter', sans-serif;
  font-size: 13px;
  background: var(--panel);
  border: 1px solid var(--border);
  color: var(--paper);
  padding: 9px 12px;
  border-radius: 4px;
  outline: none;
}
input::placeholder{ color: #7a7060; }
input:focus, select:focus{ border-color: var(--amber); }
.search{ flex: 1; min-width: 160px; }
.btn{
  font-family:'Inter', sans-serif;
  font-weight: 700;
  font-size: 13px;
  border: none;
  border-radius: 4px;
  padding: 10px 16px;
  cursor: pointer;
  transition: transform .1s ease, filter .15s ease;
}
.btn:active{ transform: translateY(1px); }
.btn:focus-visible{ outline:2px solid var(--amber); outline-offset:2px; }
.btn-amber{ background: var(--amber); color: var(--rubber); }
.btn-amber:hover{ filter: brightness(1.08); }
.btn-teal{ background: var(--teal); color: #eafcf6; }
.btn-teal:hover{ filter: brightness(1.1); }
.btn-ghost{ background: transparent; color: var(--paper-dim); border: 1px solid var(--border); }
.btn-ghost:hover{ color: var(--paper); border-color: var(--paper-dim); }
.btn-alert{ background: var(--alert); color: #fff0ee; }
.btn-sm{ padding: 6px 10px; font-size: 12px; }

/* ---------- INVENTORY (estilos legacy, usados en otras vistas si aplica) ---------- */

.empty{
  text-align:center;
  padding: 40px 20px;
  color: var(--paper-dim);
  border: 1px dashed var(--border);
  border-radius: 6px;
  font-size: 13px;
}
.empty b{ display:block; color: var(--paper); font-size:15px; margin-bottom:6px; font-family:'Archivo Black', sans-serif; text-transform:uppercase; letter-spacing:.5px;}

/* ---------- MOVEMENTS ---------- */
.moves{ display:flex; flex-direction:column; gap:8px; }
.move-row{
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 10px 14px;
  display:flex;
  align-items:center;
  gap: 12px;
  font-size: 13px;
}
.move-tag{
  font-family:'JetBrains Mono', monospace;
  font-size: 11px;
  font-weight:700;
  padding: 3px 8px;
  border-radius: 3px;
  text-transform: uppercase;
}
.move-tag.entrada{ background: rgba(76,129,119,0.25); color: #9fd9c9; }
.move-tag.salida{ background: rgba(193,68,60,0.25); color: #f2a9a2; }
.move-desc{ flex:1; }
.move-desc b{ color: var(--paper); }
.move-date{ font-family:'JetBrains Mono', monospace; font-size:11px; color: var(--paper-dim); white-space:nowrap; }

/* ---------- MODAL ---------- */
.overlay{
  display:none;
  position: fixed; inset:0;
  background: rgba(10,8,6,0.7);
  align-items:center; justify-content:center;
  z-index: 50;
  padding: 20px;
}
.overlay.show{ display:flex; }
.modal{
  background: var(--paper);
  color: var(--ink);
  width: 100%; max-width: 420px;
  border-radius: 6px;
  padding: 24px;
  position: relative;
}
.modal::before{
  content:"";
  position:absolute; top:0; left:0; right:0; height:6px;
  background: repeating-linear-gradient(90deg, var(--amber), var(--amber) 10px, var(--ink) 10px, var(--ink) 12px);
  border-radius: 6px 6px 0 0;
}
.modal h2{
  font-family:'Archivo Black', sans-serif;
  font-size: 18px;
  text-transform: uppercase;
  margin-bottom: 16px;
  padding-top: 6px;
}
.field{ margin-bottom: 12px; }
.field label{
  display:block;
  font-family:'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--ink-soft);
  margin-bottom: 5px;
}
.field input, .field select{
  width: 100%;
  background: #fff;
  border: 1px solid #cabf9f;
  color: var(--ink);
}
.field input:focus, .field select:focus{ border-color: var(--amber-dark); }
.row2{ display:grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.modal-actions{ display:flex; justify-content:flex-end; gap:8px; margin-top: 18px; }
.err{ color: var(--alert-dark); font-size:12px; margin-top:8px; display:none; font-weight:600; }
.err.show{ display:block; }

.scan-modal{ max-width: 380px; }
.scan-frame{
  position: relative;
  border-radius: 6px;
  overflow: hidden;
  background: #000;
  aspect-ratio: 4 / 3;
}
.scan-frame video{ width:100%; height:100%; object-fit: cover; display:block; }
.scan-guide{
  position: absolute;
  inset: 18% 10%;
  border: 2px dashed var(--amber);
  border-radius: 6px;
  pointer-events: none;
}
.scan-status{
  font-family:'JetBrains Mono', monospace;
  font-size: 12px;
  color: var(--ink-soft);
  text-align: center;
  margin-top: 10px;
}
.scan-feedback{
  font-family:'JetBrains Mono', monospace;
  font-size: 11px;
  padding: 8px 10px;
  border-radius: 4px;
  margin-top: -4px;
  margin-bottom: 12px;
  display: none;
}
.scan-feedback.show{ display:block; }
.scan-feedback.ok{ background: rgba(76,129,119,0.15); color: #2f5b53; border:1px solid #4c8177; }
.scan-feedback.bad{ background: rgba(193,68,60,0.12); color: var(--alert-dark); border:1px solid var(--alert); }

.helper{ font-size:11px; color:var(--paper-dim); margin: -8px 0 16px; font-family:'JetBrains Mono', monospace;}
.scan-hint{
  font-family:'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--ink-soft);
  text-align: center;
  margin-bottom: 10px;
  position: relative;
}

@media (max-width: 640px){
  .stats{ grid-template-columns: 1fr; }
  h1{ font-size: 20px; }
}

/* ---------- INVENTARIO: rediseño minimalista ---------- */
.inv-toolbar{
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: 18px;
}
.inv-search{ position: relative; }
.inv-search input{
  width: 100%;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 11px 42px 11px 14px;
  font-family: 'Inter', sans-serif;
  font-size: 14px;
  color: var(--paper);
}
.inv-search input::placeholder{ color: #7a7060; }
.inv-search input:focus{ outline: none; border-color: var(--amber); }
.inv-search button{
  position: absolute;
  right: 4px; top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  cursor: pointer;
  font-size: 15px;
  padding: 8px;
  color: var(--paper-dim);
  border-radius: 6px;
}
.inv-search button:hover{ background: var(--panel-2); }

.inv-filters{
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.inv-filters select{
  flex: 1;
  min-width: 110px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 9px 10px;
  font-family: 'Inter', sans-serif;
  font-size: 13px;
  color: var(--paper-dim);
}
.inv-filters select:focus{ outline: none; border-color: var(--amber); color: var(--paper); }

.inv-actions{
  display: flex;
  gap: 8px;
  justify-content: flex-end;
}
.inv-btn{
  font-family: 'Inter', sans-serif;
  font-size: 13px;
  font-weight: 600;
  border-radius: 8px;
  padding: 10px 16px;
  cursor: pointer;
  border: 1px solid transparent;
  transition: filter .15s ease, border-color .15s ease, color .15s ease;
}
.inv-btn-ghost{ background: transparent; border-color: var(--border); color: var(--paper-dim); }
.inv-btn-ghost:hover{ color: var(--paper); border-color: var(--paper-dim); }
.inv-btn-primary{ background: var(--amber); color: var(--rubber); }
.inv-btn-primary:hover{ filter: brightness(1.08); }

.inv-list{
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
}
.inv-row{
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 13px 16px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  transition: background .12s ease;
}
.inv-row:last-child{ border-bottom: none; }
.inv-row:hover{ background: var(--panel-2); }
.inv-dot{
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--teal);
  flex-shrink: 0;
}
.inv-row.low .inv-dot{ background: var(--alert); }
.inv-main{ flex: 1; min-width: 0; }
.inv-modelo{
  font-size: 14px;
  font-weight: 600;
  color: var(--paper);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.inv-meta{
  font-size: 12px;
  color: var(--paper-dim);
  margin-top: 2px;
}
.inv-qty{
  font-family: 'JetBrains Mono', monospace;
  font-size: 15px;
  font-weight: 600;
  color: var(--paper);
  min-width: 40px;
  text-align: right;
}
.inv-row.low .inv-qty{ color: var(--alert); }
.inv-row-actions{ display: flex; gap: 2px; }
.inv-icon{
  width: 28px; height: 28px;
  border-radius: 6px;
  border: none;
  background: transparent;
  color: var(--paper-dim);
  cursor: pointer;
  font-size: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.inv-icon:hover{ background: var(--border); color: var(--paper); }
.inv-empty{
  text-align: center;
  padding: 40px 20px;
  color: var(--paper-dim);
  font-size: 13px;
  border: 1px dashed var(--border);
  border-radius: 10px;
}

@media (max-width: 640px){
  .inv-actions{ flex-direction: column; }
  .inv-actions .inv-btn{ width: 100%; }
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen" class="login-screen">
  <div class="login-card">
    <span class="eyebrow">Dep&oacute;sito · Control de stock</span>
    <h1 class="login-title">Inventario de Suelas</h1>
    <div class="field">
      <label>Email</label>
      <input id="loginEmail" type="email" placeholder="tu@empresa.com" autocomplete="username">
    </div>
    <div class="field">
      <label>Contrase&ntilde;a</label>
      <input id="loginPassword" type="password" placeholder="••••••••" autocomplete="current-password">
    </div>
    <div class="err" id="loginErr"></div>
    <button class="btn btn-amber" id="loginBtn" style="width:100%; margin-top:6px;">Ingresar</button>
    <div class="login-status" id="loginStatus"></div>
  </div>
</div>

<div class="wrap" id="appRoot" style="display:none;">

  <header>
    <div class="brand">
      <div>
        <span class="eyebrow">Dep&oacute;sito · Control de stock</span>
        <h1>Inventario de Suelas</h1>
      </div>
    </div>
    <div class="datebadge" id="todayBadge">--/--/----</div>
    <div class="menu-wrap">
      <button class="menu-btn" id="menuToggle" title="Más opciones">⋮</button>
      <div class="menu-dropdown" id="menuDropdown">
        <button class="menu-item" id="importExcelBtn">📤 Importar Excel</button>
        <button class="menu-item" id="exportExcel">⭳ Exportar Excel</button>
        <button class="menu-item" id="backupData">💾 Backup</button>
        <button class="menu-item" id="restoreData">📥 Restaurar</button>
        <button class="menu-item" id="logoutBtn">🚪 Cerrar sesión</button>
        <input type="file" id="importExcelFile" accept=".xlsx,.xls" style="display:none;">
        <input type="file" id="restoreFile" accept="application/json" style="display:none;">
      </div>
    </div>
  </header>

  <div class="stats">
    <div class="tag"><span class="label">Modelos distintos</span><span class="value" id="statSkus">0</span></div>
    <div class="tag"><span class="label">Unidades totales</span><span class="value" id="statUnits">0</span></div>
    <div class="tag warn tag-clickable" id="statLowCard"><span class="label">Debajo del m&iacute;nimo</span><span class="value" id="statLow">0</span></div>
  </div>

  <div class="tabs">
    <button class="tabbtn active" data-tab="inv">Dep&oacute;sito Gallegos</button>
    <button class="tabbtn" data-tab="jk">Dep&oacute;sito JK</button>
    <button class="tabbtn" data-tab="mov">Movimientos</button>
    <button class="tabbtn" data-tab="low">Bajo m&iacute;nimo</button>
  </div>

  <!-- INVENTARIO -->
  <div id="tab-inv">
    <div class="inv-toolbar">
      <div class="inv-search">
        <input id="searchInput" placeholder="Buscar suela...">
        <button id="scanSearchBtn" title="Escanear código de barras">📷</button>
      </div>
      <div class="inv-filters">
        <select id="filterModelo"><option value="">Modelo</option></select>
        <select id="filterColor"><option value="">Color</option></select>
        <select id="filterTalle"><option value="">Talle</option></select>
      </div>
      <div class="inv-actions">
        <button class="inv-btn inv-btn-primary" id="openAddItem">+ Nueva suela</button>
      </div>
    </div>
    <div class="inv-list" id="itemsList"></div>
  </div>

  <!-- DEPÓSITO JK -->
  <div id="tab-jk" style="display:none;">
    <div class="inv-toolbar">
      <div class="inv-search">
        <input id="searchInputJK" placeholder="Buscar suela...">
        <button id="scanSearchBtnJK" title="Escanear código de barras">📷</button>
      </div>
      <div class="inv-filters">
        <select id="filterModeloJK"><option value="">Modelo</option></select>
        <select id="filterColorJK"><option value="">Color</option></select>
        <select id="filterTalleJK"><option value="">Talle</option></select>
      </div>
      <div class="inv-actions">
        <button class="inv-btn inv-btn-primary" id="openAddItemJK">+ Nueva suela</button>
      </div>
    </div>
    <div class="inv-list" id="jkList"></div>
  </div>

  <!-- MOVIMIENTOS -->
  <div id="tab-mov" style="display:none;">
    <div class="toolbar">
      <button class="btn btn-teal" id="openMove">Registrar movimiento</button>
    </div>
    <div class="moves" id="movesList"></div>
  </div>

  <!-- BAJO MÍNIMO -->
  <div id="tab-low" style="display:none;">
    <div class="inv-toolbar">
      <input id="lowSearchInput" placeholder="Buscar dentro de bajo mínimo..." style="background: var(--panel); border:1px solid var(--border); border-radius:8px; padding:11px 14px; font-family:'Inter',sans-serif; font-size:14px; color:var(--paper);">
    </div>
    <div class="inv-list" id="lowList"></div>
  </div>

</div>

<!-- MODAL: agregar / editar item -->
<div class="overlay" id="itemOverlay">
  <div class="modal">
    <h2 id="itemModalTitle">Nueva suela</h2>
    <div class="row2">
      <div class="field">
        <label>Modelo</label>
        <input id="fModelo" placeholder="Ej: Trekking Pro">
      </div>
      <div class="field">
        <label>Color</label>
        <input id="fColor" placeholder="Ej: Negro">
      </div>
    </div>
    <div class="row2">
      <div class="field">

, {"id": "imp1744", "modelo": "BIELLA H", "color": "GREY", "talle": "39", "codigoBarras": "009601510100391", "cantidad": 0, "minimo": 0}, {"id": "imp1745", "modelo": "BIELLA H", "color": "GREY", "talle": "40", "codigoBarras": "009601510100401", "cantidad": 0, "minimo": 0}, {"id": "imp1746", "modelo": "BIELLA H", "color": "GREY", "talle": "41", "codigoBarras": "009601510100411", "cantidad": 0, "minimo": 0}, {"id": "imp1747", "modelo": "BIELLA", "color": "GREY", "talle": "42", "codigoBarras": "009601510100421", "cantidad": 0, "minimo": 0}, {"id": "imp1748", "modelo": "BIELLA", "color": "GREY", "talle": "43", "codigoBarras": "009601510100431", "cantidad": 0, "minimo": 0}, {"id": "imp1749", "modelo": "BIELLA", "color": "GREY", "talle": "44", "codigoBarras": "009601510100441", "cantidad": 0, "minimo": 0}, {"id": "imp1750", "modelo": "BIELLA", "color": "GREY", "talle": "45", "codigoBarras": "009601510100451", "cantidad": 0, "minimo": 0}];

<script>
/* Datos y sincronización: Firebase Firestore en tiempo real, con login por email/contraseña. */
let items = [];
let itemsJK = [];
let moves = [];
let editingId = null;
let editingDeposito = 'gallegos';
let depositoActivo = 'gallegos';

const $ = (id) => document.getElementById(id);

function todayStr(){
  const d = new Date();
  return d.toLocaleDateString('es-AR', { day:'2-digit', month:'2-digit', year:'numeric' });
}
$('todayBadge').textContent = todayStr();

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

async function saveItems(){
  try{ await window.fb.setDoc(window.fb.doc(window.fb.db, 'depositos', 'gallegos'), { items }); }
  catch(e){ console.error('Error guardando items', e); }
}
async function saveItemsJK(){
  try{ await window.fb.setDoc(window.fb.doc(window.fb.db, 'depositos', 'jk'), { items: itemsJK }); }
  catch(e){ console.error('Error guardando itemsJK', e); }
}
async function addMovimiento(mov){
  try{ await window.fb.addDoc(window.fb.collection(window.fb.db, 'movimientos'), mov); }
  catch(e){ console.error('Error guardando movimiento', e); }
}

async function iniciarApp(){
  const galRef = window.fb.doc(window.fb.db, 'depositos', 'gallegos');
  const galSnap = await window.fb.getDoc(galRef);
  if(!galSnap.exists()){
    await window.fb.setDoc(galRef, { items: SEED_ITEMS });
  }

  const jkRef = window.fb.doc(window.fb.db, 'depositos', 'jk');
  const jkSnap = await window.fb.getDoc(jkRef);
  if(!jkSnap.exists()){
    const base = galSnap.exists() ? galSnap.data().items : SEED_ITEMS;
    const jkSeed = base.map(i => ({
      id: 'jk' + uid(),
      modelo: i.modelo, color: i.color, talle: i.talle,
      codigoBarras: i.codigoBarras, cantidad: 0, minimo: 0
    }));
    await window.fb.setDoc(jkRef, { items: jkSeed });
  }

  window.fb.onSnapshot(galRef, (snap) => {
    if(snap.exists()) items = snap.data().items || [];
    render();
  });
  window.fb.onSnapshot(jkRef, (snap) => {
    if(snap.exists()) itemsJK = snap.data().items || [];
    render();
  });
  const movQuery = window.fb.query(
    window.fb.collection(window.fb.db, 'movimientos'),
    window.fb.orderBy('ts', 'desc'),
    window.fb.limit(500)
  );
  window.fb.onSnapshot(movQuery, (snap) => {
    moves = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
  });
}

function mostrarApp(){
  $('loginScreen').style.display = 'none';
  $('appRoot').style.display = 'block';
}
function mostrarLogin(){
  $('appRoot').style.display = 'none';
  $('loginScreen').style.display = 'flex';
}

function iniciarFirebaseAuth(){
  window.fb.onAuthStateChanged(window.fb.auth, (user) => {
    if(user){
      mostrarApp();
      iniciarApp();
    } else {
      mostrarLogin();
    }
  });
}
if(window.fbReady){ iniciarFirebaseAuth(); }
else { window.addEventListener('firebase-ready', iniciarFirebaseAuth); }

$('loginBtn').addEventListener('click', async () => {
  const email = $('loginEmail').value.trim();
  const pass = $('loginPassword').value;
  $('loginErr').textContent = '';
  $('loginStatus').textContent = 'Ingresando...';
  try{
    await window.fb.setPersistence(window.fb.auth, window.fb.browserLocalPersistence);
    await window.fb.signInWithEmailAndPassword(window.fb.auth, email, pass);
    $('loginStatus').textContent = '';
  }catch(e){
    $('loginStatus').textContent = '';
    $('loginErr').textContent = 'Email o contraseña incorrectos.';
  }
});
$('loginPassword').addEventListener('keydown', (e) => { if(e.key === 'Enter') $('loginBtn').click(); });

const IDS_GALLEGOS = { search:'searchInput', modelo:'filterModelo', color:'filterColor', talle:'filterTalle', list:'itemsList' };
const IDS_JK = { search:'searchInputJK', modelo:'filterModeloJK', color:'filterColorJK', talle:'filterTalleJK', list:'jkList' };

function render(){
  renderFilterOptionsFor(items, IDS_GALLEGOS);
  renderFilterOptionsFor(itemsJK, IDS_JK);
  renderItems();
  renderItemsJK();
  renderStats();
  renderLowStock();
  renderMoves();
  renderMoveItemSelect();
}

function renderFilterOptionsFor(arr, ids){
  const buildOptions = (selId, placeholder, values) => {
    const sel = $(selId);
    const current = sel.value;
    sel.innerHTML = `<option value="">${placeholder}</option>` + values.map(v => `<option value="${v}">${v}</option>`).join('');
    sel.value = values.includes(current) ? current : '';
  };
  buildOptions(ids.modelo, 'Modelo', [...new Set(arr.map(i => i.modelo))].sort());
  buildOptions(ids.color, 'Color', [...new Set(arr.map(i => i.color))].sort());
  buildOptions(ids.talle, 'Talle', [...new Set(arr.map(i => i.talle))].sort());
}

function filterArray(arr, ids){
  const q = $(ids.search).value.trim().toLowerCase();
  const modeloFilter = $(ids.modelo).value;
  const colorFilter = $(ids.color).value;
  const talleFilter = $(ids.talle).value;
  return arr.filter(i => {
    const textoBase = `${i.modelo} ${i.color} ${i.talle}`.toLowerCase();
    const codigo = (i.codigoBarras || '').toLowerCase();
    const codigoCoincide = codigo && (q.startsWith(codigo) || codigo.includes(q));
    const matchesQ = !q || textoBase.includes(q) || codigoCoincide;
    const matchesModelo = !modeloFilter || i.modelo === modeloFilter;
    const matchesColor = !colorFilter || i.color === colorFilter;
    const matchesTalle = !talleFilter || i.talle === talleFilter;
    return matchesQ && matchesModelo && matchesColor && matchesTalle;
  });
}

function itemRowHtml(i, dep){
  const low = i.cantidad <= i.minimo;
  return `
    <div class="inv-row ${low ? 'low' : ''}">
      <div class="inv-dot"></div>
      <div class="inv-main">
        <div class="inv-modelo">${i.modelo}</div>
        <div class="inv-meta">${i.color} · Talle ${i.talle}${i.codigoBarras ? ' · ' + i.codigoBarras : ''}</div>
      </div>
      <div class="inv-qty">${i.cantidad}</div>
      <div class="inv-row-actions">
        <button class="inv-icon" title="Editar" onclick="openEditItem('${i.id}','${dep}')">✎</button>
        <button class="inv-icon" title="Eliminar" onclick="deleteItem('${i.id}','${dep}')">✕</button>
      </div>
    </div>`;
}

function renderListInto(arr, listId, dep, emptyMsg){
  const list = $(listId);
  if(arr.length === 0){
    list.innerHTML = `<div class="inv-empty">${emptyMsg}</div>`;
    return;
  }
  list.innerHTML = arr.map(i => itemRowHtml(i, dep)).join('');
}

function renderItems(){
  renderListInto(filterArray(items, IDS_GALLEGOS), 'itemsList', 'gallegos', 'Sin resultados. Agregá una suela nueva o ajustá los filtros.');
}
function renderItemsJK(){
  renderListInto(filterArray(itemsJK, IDS_JK), 'jkList', 'jk', 'Sin resultados. Agregá una suela nueva o ajustá los filtros.');
}

function renderStats(){
  $('statSkus').textContent = items.length;
  $('statUnits').textContent = items.reduce((a,i) => a + i.cantidad, 0);
  $('statLow').textContent = items.filter(i => i.cantidad <= i.minimo).length;
}

function lowStockItems(){
  const q = $('lowSearchInput').value.trim().toLowerCase();
  return items.filter(i => i.cantidad <= i.minimo).filter(i => {
    if(!q) return true;
    const textoBase = `${i.modelo} ${i.color} ${i.talle}`.toLowerCase();
    const codigo = (i.codigoBarras || '').toLowerCase();
    return textoBase.includes(q) || (codigo && (q.startsWith(codigo) || codigo.includes(q)));
  });
}

function renderLowStock(){
  const list = $('lowList');
  const data = lowStockItems();
  if(data.length === 0){
    list.innerHTML = `<div class="inv-empty">Ninguna suela está por debajo de su stock mínimo. 🎉</div>`;
    return;
  }
  list.innerHTML = data.map(i => itemRowHtml(i, 'gallegos')).join('');
}

function renderMoves(){
  const list = $('movesList');
  if(moves.length === 0){
    list.innerHTML = `<div class="empty"><b>Todav&iacute;a no hay movimientos</b>Registr&aacute; entradas y salidas de stock desde ac&aacute;.</div>`;
    return;
  }
  const sorted = [...moves].sort((a,b) => b.ts - a.ts);
  list.innerHTML = sorted.map(m => {
    const dep = m.deposito || 'gallegos';
    const arr = dep === 'jk' ? itemsJK : items;
    const item = arr.find(i => i.id === m.itemId);
    const desc = item ? `${item.modelo} ${item.color} T${item.talle}` : '(eliminado)';
    const depLabel = dep === 'jk' ? 'JK' : 'Gallegos';
    return `
    <div class="move-row">
      <span class="move-tag ${m.tipo}">${m.tipo === 'entrada' ? '↑ Entrada' : '↓ Salida'}</span>
      <span class="move-desc"><b>${m.cantidad}</b> — ${desc}${m.nota ? ' · ' + m.nota : ''} <span style="color:var(--paper-dim); font-family:'JetBrains Mono', monospace; font-size:10px;">· ${depLabel}</span></span>
      <span class="move-date">${m.fecha}</span>
    </div>`;
  }).join('');
}

let mItemMap = {};
function labelDeItem(i){
  return `${i.modelo} — ${i.color} — Talle ${i.talle} (stock: ${i.cantidad})`;
}
function renderMoveItemSelect(){
  const dep = $('mDeposito').value || 'gallegos';
  const arr = dep === 'jk' ? itemsJK : items;
  mItemMap = {};
  $('mItemDatalist').innerHTML = arr.map(i => {
    const label = labelDeItem(i);
    mItemMap[label] = i.id;
    return `<option value="${label}"></option>`;
  }).join('');
  $('mItemInput').value = '';
  $('mItem').value = '';
}
$('mDeposito').addEventListener('change', renderMoveItemSelect);
$('mItemInput').addEventListener('input', () => {
  $('mItem').value = mItemMap[$('mItemInput').value] || '';
});

/* ---------- TABS ---------- */
function switchTab(tab){
  document.querySelectorAll('.tabbtn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  $('tab-inv').style.display = tab === 'inv' ? 'block' : 'none';
  $('tab-jk').style.display = tab === 'jk' ? 'block' : 'none';
  $('tab-mov').style.display = tab === 'mov' ? 'block' : 'none';
  $('tab-low').style.display = tab === 'low' ? 'block' : 'none';
  if(tab === 'low') renderLowStock();
  if(tab === 'inv' || tab === 'jk') depositoActivo = tab === 'jk' ? 'jk' : 'gallegos';
}
document.querySelectorAll('.tabbtn').forEach(btn => {
  btn.addEventListener('click', () => switchTab(btn.dataset.tab));
});
$('statLowCard').addEventListener('click', () => switchTab('low'));

/* ---------- SEARCH / FILTER ---------- */
$('searchInput').addEventListener('input', renderItems);
$('filterModelo').addEventListener('change', renderItems);
$('filterColor').addEventListener('change', renderItems);
$('filterTalle').addEventListener('change', renderItems);
$('searchInputJK').addEventListener('input', renderItemsJK);
$('filterModeloJK').addEventListener('change', renderItemsJK);
$('filterColorJK').addEventListener('change', renderItemsJK);
$('filterTalleJK').addEventListener('change', renderItemsJK);
$('lowSearchInput').addEventListener('input', renderLowStock);

/* ---------- ITEM MODAL ---------- */
function arrayDeDeposito(dep){ return dep === 'jk' ? itemsJK : items; }
function saveDeposito(dep){ return dep === 'jk' ? saveItemsJK() : saveItems(); }

function openAddItemModal(dep){
  editingId = null;
  editingDeposito = dep;
  $('itemModalTitle').textContent = dep === 'jk' ? 'Nueva suela — Depósito JK' : 'Nueva suela — Depósito Gallegos';
  $('fModelo').value = '';
  $('fColor').value = '';
  $('fTalle').value = '';
  $('fCodigo').value = '';
  $('fCantidad').value = 0;
  $('fMinimo').value = 5;
  $('itemErr').classList.remove('show');
  $('itemOverlay').classList.add('show');
}
window.openEditItem = function(id, dep){
  const item = arrayDeDeposito(dep).find(i => i.id === id);
  if(!item) return;
  editingId = id;
  editingDeposito = dep;
  $('itemModalTitle').textContent = dep === 'jk' ? 'Editar suela — Depósito JK' : 'Editar suela — Depósito Gallegos';
  $('fModelo').value = item.modelo;
  $('fColor').value = item.color;
  $('fTalle').value = item.talle;
  $('fCodigo').value = item.codigoBarras || '';
  $('fCantidad').value = item.cantidad;
  $('fMinimo').value = item.minimo;
  $('itemErr').classList.remove('show');
  $('itemOverlay').classList.add('show');
};
window.deleteItem = function(id, dep){
  if(!confirm('¿Eliminar esta suela del depósito?')) return;
  if(dep === 'jk'){ itemsJK = itemsJK.filter(i => i.id !== id); saveItemsJK(); }
  else { items = items.filter(i => i.id !== id); saveItems(); }
  render();
};
$('openAddItem').addEventListener('click', () => openAddItemModal('gallegos'));
$('openAddItemJK').addEventListener('click', () => openAddItemModal('jk'));
$('cancelItem').addEventListener('click', () => $('itemOverlay').classList.remove('show'));

$('saveItem').addEventListener('click', async () => {
  const modelo = $('fModelo').value.trim();
  const color = $('fColor').value.trim();
  const talle = $('fTalle').value.trim();
  const codigoBarras = $('fCodigo').value.trim();
  const cantidad = parseInt($('fCantidad').value, 10);
  const minimo = parseInt($('fMinimo').value, 10);

  if(!modelo || !color || !talle || isNaN(cantidad) || isNaN(minimo) || cantidad < 0 || minimo < 0){
    $('itemErr').textContent = 'Completá modelo, color, talle, cantidad y mínimo con valores válidos.';
    $('itemErr').classList.add('show');
    return;
  }

  if(editingId){
    const item = arrayDeDeposito(editingDeposito).find(i => i.id === editingId);
    Object.assign(item, { modelo, color, talle, codigoBarras, cantidad, minimo });
  } else if(editingDeposito === 'jk'){
    itemsJK.push({ id: uid(), modelo, color, talle, codigoBarras, cantidad, minimo });
  } else {
    items.push({ id: uid(), modelo, color, talle, codigoBarras, cantidad, minimo });
  }
  await saveDeposito(editingDeposito);
  $('itemOverlay').classList.remove('show');
  render();
});

/* ---------- MOVE MODAL ---------- */
$('openMove').addEventListener('click', () => {
  if(items.length === 0 && itemsJK.length === 0){
    alert('Primero agregá al menos una suela a algún depósito.');
    return;
  }
  $('mDeposito').value = depositoActivo;
  $('mTipo').value = 'entrada';
  $('mCantidad').value = 1;
  $('mNota').value = '';
  $('moveErr').classList.remove('show');
  renderMoveItemSelect();
  $('moveOverlay').classList.add('show');
});
$('cancelMove').addEventListener('click', () => { closeScanner(); $('moveOverlay').classList.remove('show'); });

$('saveMove').addEventListener('click', async () => {
  const dep = $('mDeposito').value;
  const arr = dep === 'jk' ? itemsJK : items;
  const itemId = $('mItem').value;
  const tipo = $('mTipo').value;
  const cantidad = parseInt($('mCantidad').value, 10);
  const nota = $('mNota').value.trim();
  const item = arr.find(i => i.id === itemId);

  if(!item || isNaN(cantidad) || cantidad <= 0){
    $('moveErr').textContent = 'Elegí una suela y una cantidad válida.';
    $('moveErr').classList.add('show');
    return;
  }
  if(tipo === 'salida' && cantidad > item.cantidad){
    $('moveErr').textContent = `No hay stock suficiente (disponible: ${item.cantidad}).`;
    $('moveErr').classList.add('show');
    return;
  }

  item.cantidad += tipo === 'entrada' ? cantidad : -cantidad;

  await saveDeposito(dep);
  await addMovimiento({ itemId, deposito: dep, tipo, cantidad, nota, fecha: todayStr(), ts: Date.now() });
  $('moveOverlay').classList.remove('show');
  render();
});

/* ---------- ESCÁNER DE CÓDIGO DE BARRAS ---------- */
let scanStream = null;
let scanTarget = null;
let scanRAF = null;
let scanPaused = false;
let scanFlashTimeout = null;
let audioCtx = null;

function ensureAudioCtx(){
  if(!audioCtx){
    try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ /* audio no disponible */ }
  }
  if(audioCtx && audioCtx.state === 'suspended'){ audioCtx.resume().catch(() => {}); }
}

function beep(ok){
  if(!audioCtx) return;
  const tone = (freq, start, dur) => {
    try{
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.type = 'sine';
      osc.frequency.value = freq;
      const t0 = audioCtx.currentTime + start;
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(0.25, t0 + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.start(t0);
      osc.stop(t0 + dur + 0.02);
    }catch(e){ /* audio no disponible */ }
  };
  if(ok){
    tone(1050, 0, 0.11); // pip agudo y corto: escaneo aplicado
  } else {
    tone(220, 0, 0.16);      // dos tonos graves: no se pudo aplicar
    tone(220, 0.2, 0.16);
  }
}

async function openScanner(target){
  scanTarget = target;
  scanPaused = false;
  ensureAudioCtx();
  $('scanStatus').textContent = target === 'movimiento'
    ? `Escaneá cada suela: se suma o resta sola del Depósito ${$('mDeposito').value === 'jk' ? 'JK' : 'Gallegos'}.`
    : 'Apuntá la cámara al código de barras...';
  $('scanFeedback').classList.remove('show', 'ok', 'bad');
  $('scanOverlay').classList.add('show');

  if(!('BarcodeDetector' in window)){
    $('scanStatus').textContent = 'Tu navegador no soporta el lector con cámara. Escribí el código a mano.';
    return;
  }
  try{
    scanStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    const video = $('scanVideo');
    video.srcObject = scanStream;
    await video.play();
    const detector = new BarcodeDetector({ formats: ['ean_13','ean_8','upc_a','upc_e','code_128','code_39','itf','codabar'] });
    const tick = async () => {
      if(!scanStream) return;
      if(!scanPaused){
        try{
          const codes = await detector.detect(video);
          if(codes.length > 0){ handleScanResult(codes[0].rawValue); }
        }catch(e){ /* frame sin datos válidos, seguir intentando */ }
      }
      scanRAF = requestAnimationFrame(tick);
    };
    scanRAF = requestAnimationFrame(tick);
  }catch(e){
    $('scanStatus').textContent = 'No se pudo acceder a la cámara. Revisá los permisos del navegador.';
  }
}

function encontrarItemPorCodigo(code, arr){
  if(!code) return null;
  let mejor = null;
  for(const it of arr){
    if(it.codigoBarras && code.startsWith(it.codigoBarras)){
      if(!mejor || it.codigoBarras.length > mejor.codigoBarras.length) mejor = it;
    }
  }
  return mejor;
}

function handleScanResult(code){
  if(scanTarget === 'movimiento'){
    applyMovementScan(code);
    return; // la cámara sigue activa para encadenar más escaneos
  }
  beep(true);
  closeScanner();
  if(scanTarget === 'search'){
    const match = encontrarItemPorCodigo(code, items);
    $('searchInput').value = match ? match.codigoBarras : code;
    renderItems();
  } else if(scanTarget === 'searchJK'){
    const match = encontrarItemPorCodigo(code, itemsJK);
    $('searchInputJK').value = match ? match.codigoBarras : code;
    renderItemsJK();
  } else if(scanTarget === 'fCodigo'){
    $('fCodigo').value = code;
  }
}

async function applyMovementScan(code){
  scanPaused = true; // evita leer el mismo código varias veces seguidas

  const dep = $('mDeposito').value;
  const arr = dep === 'jk' ? itemsJK : items;
  const item = encontrarItemPorCodigo(code, arr);
  const tipo = $('mTipo').value;
  const cantidad = parseInt($('mCantidad').value, 10) || 1;

  if(!item){
    beep(false);
    scanFeedback(`✕ Código sin coincidencia en el Depósito ${dep === 'jk' ? 'JK' : 'Gallegos'}: ${code}`, false);
  } else if(tipo === 'salida' && cantidad > item.cantidad){
    beep(false);
    scanFeedback(`✕ Stock insuficiente de ${item.modelo} ${item.color} T${item.talle} (disponible: ${item.cantidad})`, false);
  } else {
    item.cantidad += tipo === 'entrada' ? cantidad : -cantidad;
    await saveDeposito(dep);
    await addMovimiento({ itemId: item.id, deposito: dep, tipo, cantidad, nota: '', fecha: todayStr(), ts: Date.now() });
    render();
    $('mItem').value = item.id;
    $('mItemInput').value = labelDeItem(item);
    beep(true);
    scanFeedback(`✓ ${tipo === 'entrada' ? 'Entrada' : 'Salida'} aplicada: ${item.modelo} ${item.color} T${item.talle} (${tipo === 'entrada' ? '+' : '-'}${cantidad})`, true);
  }

  setTimeout(() => { scanPaused = false; }, 1400);
}

function scanFeedback(msg, ok){
  const el = $('scanFeedback');
  el.textContent = msg;
  el.className = 'scan-feedback show ' + (ok ? 'ok' : 'bad');
  clearTimeout(scanFlashTimeout);
  scanFlashTimeout = setTimeout(() => { el.classList.remove('show'); }, 2200);
}

function closeScanner(){
  if(scanRAF) cancelAnimationFrame(scanRAF);
  scanRAF = null;
  scanPaused = false;
  if(scanStream){
    scanStream.getTracks().forEach(t => t.stop());
    scanStream = null;
  }
  $('scanOverlay').classList.remove('show');
}

$('scanSearchBtn').addEventListener('click', () => openScanner('search'));
$('scanSearchBtnJK').addEventListener('click', () => openScanner('searchJK'));
$('scanCodigoBtn').addEventListener('click', () => openScanner('fCodigo'));
$('openMoveScan').addEventListener('click', () => {
  const dep = $('mDeposito').value;
  const arr = dep === 'jk' ? itemsJK : items;
  if(arr.length === 0){
    alert(`El Depósito ${dep === 'jk' ? 'JK' : 'Gallegos'} todavía no tiene suelas cargadas.`);
    return;
  }
  openScanner('movimiento');
});
$('cancelScan').addEventListener('click', closeScanner);
$('scanOverlay').addEventListener('click', (e) => { if(e.target === $('scanOverlay')) closeScanner(); });


/* ---------- IMPORTAR EXCEL ---------- */
function normalizarEncabezado(s){
  return s.toString().trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
}
const ALIAS_COLUMNAS = {
  modelo: ['modelo', 'articulo', 'articulos'],
  color: ['color'],
  talle: ['talle', 'talla', 'numero', 'nº', 'n'],
  cantidad: ['cantidad', 'cant', 'stock'],
  minimo: ['stock minimo', 'minimo', 'stock min'],
  codigo: ['codigo de barras', 'codigo', 'barcode', 'ean']
};
function buscarColumna(headerKeys, tipo){
  for(const k of headerKeys){
    if(ALIAS_COLUMNAS[tipo].includes(normalizarEncabezado(k))) return k;
  }
  return null;
}

let importTargetDep = 'gallegos';
$('importExcelBtn').addEventListener('click', () => {
  closeMenu();
  const esGallegos = confirm('¿A qué depósito vas a importar este Excel?\n\nAceptar = Depósito Gallegos.\nCancelar = Depósito JK.');
  importTargetDep = esGallegos ? 'gallegos' : 'jk';
  $('importExcelFile').click();
});

$('importExcelFile').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async (ev) => {
    try{
      const wb = XLSX.read(ev.target.result, { type: 'array' });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, { defval: '' });

      if(rows.length === 0){
        alert('El Excel no tiene filas de datos.');
        return;
      }

      const headerKeys = Object.keys(rows[0]);
      const kModelo = buscarColumna(headerKeys, 'modelo');
      const kColor = buscarColumna(headerKeys, 'color');
      const kTalle = buscarColumna(headerKeys, 'talle');
      const kCantidad = buscarColumna(headerKeys, 'cantidad');
      const kMinimo = buscarColumna(headerKeys, 'minimo');
      const kCodigo = buscarColumna(headerKeys, 'codigo');

      if(!kModelo || !kColor || !kTalle || !kCantidad){
        alert('Faltan columnas obligatorias. El Excel necesita al menos: Modelo, Color, Talle y Cantidad. Revisá los nombres de los encabezados en la primera fila.');
        return;
      }

      const parsed = [];
      for(const row of rows){
        const modelo = (row[kModelo] ?? '').toString().trim();
        const color = (row[kColor] ?? '').toString().trim();
        const talle = (row[kTalle] ?? '').toString().trim();
        const cantidad = parseInt(row[kCantidad], 10);
        if(!modelo || !color || !talle || isNaN(cantidad)) continue;
        const minimo = kMinimo ? (parseInt(row[kMinimo], 10) || 0) : 0;
        const codigoBarras = kCodigo ? (row[kCodigo] ?? '').toString().trim() : '';
        parsed.push({ modelo, color, talle, cantidad, minimo, codigoBarras });
      }

      if(parsed.length === 0){
        alert('No se pudo leer ninguna fila válida. Revisá que Modelo, Color, Talle y Cantidad estén completos.');
        return;
      }

      const depNombre = importTargetDep === 'jk' ? 'Depósito JK' : 'Depósito Gallegos';
      const reemplazar = confirm(`Se encontraron ${parsed.length} filas válidas para ${depNombre}.\n\nAceptar = REEMPLAZAR todo ese depósito por estos datos.\nCancelar = elegir sumarlos al depósito existente en el siguiente paso.`);

      let arr = importTargetDep === 'jk' ? itemsJK : items;

      if(reemplazar){
        arr = parsed.map(p => ({ id: uid(), ...p }));
      } else {
        const sumar = confirm('¿Sumar estas filas al depósito existente?\n\nSi una suela con el mismo modelo, color y talle ya existe, se suma la cantidad. Si no existe, se agrega nueva.\n\nCancelar aborta la importación sin cambiar nada.');
        if(!sumar) return;
        parsed.forEach(p => {
          const existente = arr.find(i =>
            i.modelo.toLowerCase() === p.modelo.toLowerCase() &&
            i.color.toLowerCase() === p.color.toLowerCase() &&
            i.talle.toLowerCase() === p.talle.toLowerCase()
          );
          if(existente){
            existente.cantidad += p.cantidad;
            if(!existente.codigoBarras && p.codigoBarras) existente.codigoBarras = p.codigoBarras;
          } else {
            arr.push({ id: uid(), ...p });
          }
        });
      }

      if(importTargetDep === 'jk'){ itemsJK = arr; await saveItemsJK(); }
      else { items = arr; await saveItems(); }
      render();
      alert(`Importación completa: ${parsed.length} filas procesadas en ${depNombre}.`);
    }catch(err){
      alert('No se pudo leer el archivo. Verificá que sea un .xlsx válido con el formato indicado.');
    }
    $('importExcelFile').value = '';
  };
  reader.readAsArrayBuffer(file);
});

/* ---------- BACKUP / RESTAURAR (para mover datos entre celular y PC) ---------- */
$('backupData').addEventListener('click', () => {
  closeMenu();
  const backup = {
    exportado: new Date().toISOString(),
    items,
    itemsJK,
    moves
  };
  const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `inventario-suelas-backup-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
});

$('restoreData').addEventListener('click', () => { closeMenu(); $('restoreFile').click(); });

$('restoreFile').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async (ev) => {
    try{
      const data = JSON.parse(ev.target.result);
      if(!Array.isArray(data.items)){
        alert('Este archivo no parece un backup válido del inventario.');
        return;
      }
      const cantidadItems = data.items.length;
      const cantidadJK = Array.isArray(data.itemsJK) ? data.itemsJK.length : 0;
      const ok = confirm(`Este backup tiene ${cantidadItems} suelas en Gallegos y ${cantidadJK} en JK.\n\nEsto va a REEMPLAZAR el inventario de ambos depósitos para todos los que usan la app (el historial de Movimientos no se toca). ¿Continuar?`);
      if(!ok) return;
      items = data.items;
      if(Array.isArray(data.itemsJK)) itemsJK = data.itemsJK;
      await saveItems();
      await saveItemsJK();
      alert('Backup restaurado correctamente.');
    }catch(err){
      alert('No se pudo leer el archivo. Verificá que sea un backup exportado desde esta misma app.');
    }
    $('restoreFile').value = '';
  };
  reader.readAsText(file);
});

/* ---------- EXPORT EXCEL ---------- */
$('exportExcel').addEventListener('click', () => {
  closeMenu();
  const esGallegos = confirm('¿Qué depósito querés exportar a Excel?\n\nAceptar = Depósito Gallegos.\nCancelar = Depósito JK.');
  const arr = esGallegos ? items : itemsJK;
  const nombreDep = esGallegos ? 'gallegos' : 'jk';
  if(arr.length === 0){
    alert('Ese depósito no tiene suelas cargadas todavía.');
    return;
  }
  const rows = arr.map(i => ({
    'Modelo': i.modelo,
    'Color': i.color,
    'Talle': i.talle,
    'Código de barras': i.codigoBarras || '',
    'Cantidad': i.cantidad,
    'Stock mínimo': i.minimo,
    'Estado': i.cantidad <= i.minimo ? 'BAJO MÍNIMO' : 'OK'
  }));
  const ws = XLSX.utils.json_to_sheet(rows);
  ws['!cols'] = [{wch:18},{wch:14},{wch:8},{wch:18},{wch:10},{wch:12},{wch:14}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Inventario');
  const fecha = new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb, `inventario-${nombreDep}-${fecha}.xlsx`);
});
