<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Corregir códigos USHUAIA - Firebase</title>
<style>
  body{
    font-family: -apple-system, 'Segoe UI', Arial, sans-serif;
    background: #17130F;
    color: #F4EEE1;
    padding: 28px 20px;
    max-width: 620px;
    margin: 0 auto;
    line-height: 1.5;
  }
  h1{ font-size: 20px; margin-bottom: 6px; }
  .sub{ color: #a89c86; font-size: 13px; margin-bottom: 24px; }
  .card{
    background: #241E18;
    border: 1px solid #3A3025;
    border-radius: 8px;
    padding: 18px;
    margin-bottom: 16px;
  }
  .field{ margin-bottom: 12px; }
  .field label{ display:block; font-size: 12px; color:#a89c86; margin-bottom:4px; }
  .field input{
    width: 100%; background:#17130F; border:1px solid #3A3025; color:#F4EEE1;
    border-radius:6px; padding:10px 12px; font-size:14px; box-sizing:border-box;
  }
  button{
    background: #E3A23C; color: #17130F; border: none; border-radius: 6px;
    padding: 12px 20px; font-size: 14px; font-weight: 700; cursor: pointer; width: 100%;
    margin-top: 8px;
  }
  button.secundario{ background:#4C8177; color:#eafcf6; }
  button:disabled{ background: #3A3025; color: #a89c86; cursor: not-allowed; }
  table{ width:100%; border-collapse: collapse; font-size: 12px; margin-top: 10px; }
  th, td{ text-align:left; padding: 4px 6px; border-bottom: 1px solid #3A3025; }
  .estado{ font-size: 13px; margin-top: 10px; color:#a89c86; }
  .ok{ color:#9fd9c9; }
  .err{ color:#f2a9a2; }
</style>
</head>
<body>
  <h1>Corregir códigos de barra — USHUAIA</h1>
  <div class="sub">Cambia el último dígito de "2" a "1" en los códigos de barra del modelo USHUAIA, directo en Firebase. No toca cantidades ni ningún otro dato.</div>

  <div class="card" id="loginCard">
    <div class="field">
      <label>Email</label>
      <input id="loginEmail" type="email" autocomplete="username">
    </div>
    <div class="field">
      <label>Contraseña</label>
      <input id="loginPassword" type="password" autocomplete="current-password">
    </div>
    <button id="loginBtn">Ingresar</button>
    <div class="estado" id="loginEstado"></div>
  </div>

  <div class="card" id="previewCard" style="display:none;">
    <div id="previewTexto">Buscando registros de USHUAIA...</div>
    <div id="previewTabla"></div>
    <button id="aplicarBtn" style="display:none;">Aplicar corrección en Firebase</button>
    <div class="estado" id="aplicarEstado"></div>
  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getAuth, signInWithEmailAndPassword, onAuthStateChanged,
    setPersistence, browserLocalPersistence
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import {
    getFirestore, doc, getDoc, setDoc
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDNVDS93GU-zVnFFKdlYZaE1P3SjY0sjAc",
    authDomain: "inventario-jk.firebaseapp.com",
    projectId: "inventario-jk",
    storageBucket: "inventario-jk.firebasestorage.app",
    messagingSenderId: "281058219271",
    appId: "1:281058219271:web:33480573ae64181c0121a2"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const $ = (id) => document.getElementById(id);

  function corregirArray(arr){
    const cambios = [];
    const nuevo = arr.map(it => {
      if(it.modelo && it.modelo.trim().toUpperCase() === 'USHUAIA' && it.codigoBarras && it.codigoBarras.endsWith('2')){
        const antes = it.codigoBarras;
        const despues = antes.slice(0, -1) + '1';
        cambios.push({ color: it.color, talle: it.talle, antes, despues });
        return { ...it, codigoBarras: despues };
      }
      return it;
    });
    return { nuevo, cambios };
  }

  let planGallegos = null;
  let planJK = null;

  async function prepararVistaPrevia(){
    $('previewCard').style.display = 'block';

    const galRef = doc(db, 'depositos', 'gallegos');
    const jkRef = doc(db, 'depositos', 'jk');
    const [galSnap, jkSnap] = await Promise.all([getDoc(galRef), getDoc(jkRef)]);

    const itemsGal = galSnap.exists() ? (galSnap.data().items || []) : [];
    const itemsJK = jkSnap.exists() ? (jkSnap.data().items || []) : [];

    planGallegos = corregirArray(itemsGal);
    planJK = corregirArray(itemsJK);

    const total = planGallegos.cambios.length + planJK.cambios.length;
    if(total === 0){
      $('previewTexto').innerHTML = 'No se encontraron códigos de USHUAIA terminados en "2" para corregir. Puede que ya estén corregidos.';
      return;
    }

    $('previewTexto').innerHTML = `Se van a corregir <b>${planGallegos.cambios.length}</b> códigos en Depósito Gallegos y <b>${planJK.cambios.length}</b> en Depósito JK (total ${total}).`;

    const filas = [...planGallegos.cambios.map(c => ({...c, dep:'Gallegos'})), ...planJK.cambios.map(c => ({...c, dep:'JK'}))];
    let html = '<table><tr><th>Depósito</th><th>Color</th><th>Talle</th><th>Antes</th><th>Después</th></tr>';
    filas.forEach(c => {
      html += `<tr><td>${c.dep}</td><td>${c.color}</td><td>${c.talle}</td><td>${c.antes}</td><td>${c.despues}</td></tr>`;
    });
    html += '</table>';
    $('previewTabla').innerHTML = html;
    $('aplicarBtn').style.display = 'block';
  }

  $('aplicarBtn').addEventListener('click', async () => {
    $('aplicarBtn').disabled = true;
    $('aplicarEstado').textContent = 'Aplicando...';
    $('aplicarEstado').className = 'estado';
    try{
      if(planGallegos.cambios.length > 0){
        await setDoc(doc(db, 'depositos', 'gallegos'), { items: planGallegos.nuevo });
      }
      if(planJK.cambios.length > 0){
        await setDoc(doc(db, 'depositos', 'jk'), { items: planJK.nuevo });
      }
      $('aplicarEstado').textContent = '✓ Corrección aplicada correctamente en Firebase.';
      $('aplicarEstado').className = 'estado ok';
    }catch(e){
      $('aplicarEstado').textContent = '✕ Error al guardar: ' + e.message;
      $('aplicarEstado').className = 'estado err';
      $('aplicarBtn').disabled = false;
    }
  });

  onAuthStateChanged(auth, (user) => {
    if(user){
      $('loginCard').style.display = 'none';
      prepararVistaPrevia();
    }
  });

  $('loginBtn').addEventListener('click', async () => {
    const email = $('loginEmail').value.trim();
    const pass = $('loginPassword').value;
    $('loginEstado').textContent = 'Ingresando...';
    try{
      await setPersistence(auth, browserLocalPersistence);
      await signInWithEmailAndPassword(auth, email, pass);
    }catch(e){
      $('loginEstado').textContent = 'Email o contraseña incorrectos.';
    }
  });
</script>
</body>
</html>
